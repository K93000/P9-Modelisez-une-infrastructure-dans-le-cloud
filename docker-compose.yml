services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.5
    container_name: redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "19644:9644"

  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    container_name: producer_tickets
    depends_on:
      - redpanda
    restart: on-failure
    environment:
      - KAFKA_SERVER=redpanda:29092

  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark_processor
    depends_on:
      - redpanda
    restart: on-failure
    environment:
      - KAFKA_SERVER=redpanda:29092
    volumes:
      - ./output_json:/app/output_json